name: Build & Release Snaps APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.2)'
        required: true
        default: '1.0.2'
      changelog:
        description: 'Changelog / Release Notes'
        required: false
        default: 'Pembaruan sistem, fitur baru, dan perbaikan performa.'

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Determine Tag Name
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Snaps Mobile ${{ steps.vars.outputs.tag }}
          body: |
            ## Pembaruan Snaps Mobile ${{ steps.vars.outputs.tag }}
            ${{ github.event.inputs.changelog || 'Pembaruan rilis otomatis dari GitHub Actions.' }}

            ### Unduhan Langsung (Direct Download APK)
            - File: `app-release.apk`
            - Kompatibilitas: Android 6.0+ (ARM64 & ARM32)
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
