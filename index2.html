<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pop Site - Free Personal Site Builder &amp; Linktree Alternative</title>
  <link rel="icon" href="https://framerusercontent.com/images/K9dDDIVcr8GTjlz3h0uT98mXA.png" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Google Sans Flex & Inter & Instrument Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    @font-face {
      font-family: 'Google Sans Flex Variable';
      font-style: normal;
      font-weight: 100 1000;
      font-display: swap;
      src: url('https://fonts.gstatic.com/s/googlesansflex/v22/t5t7IQcYNIWbFgDgAAzZ34auoVyXurOmfyca.woff2') format('woff2');
    }

    body {
      font-family: 'Google Sans Flex Variable', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #ffffff;
      color: #171717;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    .hero-heading {
      letter-spacing: -0.04em;
      line-height: 0.98;
    }

    .phone-container {
      perspective: 1200px;
    }

    .phone-mockup {
      width: 290px;
      height: 590px;
      border-radius: 46px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(0, 0, 0, 0.08);
      background-color: #000;
      flex-shrink: 0;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .phone-mockup:hover {
      transform: translateY(-8px);
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .phone-bezel {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-size: 100% 100%;
      z-index: 10;
    }

    /* Custom subtle scrollbar */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

          <a href="https://pop.site/sections" class="hover:text-neutral-500 transition-colors">Sections</a>
          <a href="https://pop.site/blog" class="hover:text-neutral-500 transition-colors">Blog</a>
          <a href="https://pop.site/featured" class="hover:text-neutral-500 transition-colors">Featured</a>
          <a href="https://pop.site/memberships" class="hover:text-neutral-500 transition-colors">Memberships</a>
        </div>

        <div class="hidden md:block h-4 w-px bg-neutral-200/80"></div>

        <div class="flex items-center gap-5 text-[14px] font-medium">
          <a href="https://app.pop.site" target="_blank" class="text-neutral-800 hover:text-neutral-500 transition-colors">Create Account</a>
          <a href="https://app.pop.site?signin" target="_blank" class="text-neutral-800 hover:text-neutral-500 transition-colors">Log In</a>
        </div>
      </nav>

  </header>

  <!-- ================= HERO SECTION ================= -->
  <main class="flex-1 flex flex-col items-center pt-10 md:pt-14 pb-12 overflow-hidden">
    
    <!-- Top Pill Badge -->
    <div class="mb-7">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg border border-neutral-200/80 bg-white shadow-[0_1px_3px_rgba(0,0,0,0.04)] text-[13px] font-medium text-neutral-800">
        <svg class="w-3.5 h-3.5 text-sky-500 fill-current" viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
        <span>Join 10K+ Site Makers</span>
      </div>
    </div>

    <!-- Main Headline (Exact Typography, Pure Black Sans-Serif) -->
    <div class="max-w-4xl px-4 text-center">
      <h1 class="hero-heading text-[52px] sm:text-[72px] md:text-[88px] lg:text-[96px] font-black text-neutral-900 tracking-[-0.045em] select-none">
        The site builder with<br/>zero learning curve.
      </h1>
      
      <!-- Subheadline -->
      <p class="mt-5 text-[18px] sm:text-[20px] text-neutral-500 font-normal tracking-tight max-w-xl mx-auto leading-relaxed">
        Launch a site that actually looks pro, from your phone or desktop.
      </p>
    </div>

    <!-- Claim Username Form -->
    <div class="mt-8 w-full max-w-md px-4 flex flex-col items-center">
      <form class="w-full flex flex-col sm:flex-row items-center justify-center gap-2.5" onsubmit="event.preventDefault(); window.open('https://app.pop.site', '_blank');">
        
        <!-- Input Box with Suffix -->
        <div class="w-full sm:w-auto flex-1 flex items-center justify-between bg-neutral-100/90 border border-neutral-200/80 rounded-2xl px-4 py-2.5 transition focus-within:border-neutral-400 focus-within:bg-white focus-within:ring-2 focus-within:ring-neutral-100">
          <input 
            type="text" 
            placeholder="yourname" 
            class="bg-transparent text-[15px] text-neutral-900 placeholder:text-neutral-400 focus:outline-none w-full"
            id="username-input"
          />
          <span class="text-neutral-400 font-medium text-[15px] pl-1 select-none">.pop.site</span>
        </div>

        <!-- CTA Button -->
        <button 
          type="submit"
          class="w-full sm:w-auto whitespace-nowrap bg-neutral-900 hover:bg-black text-white font-medium text-[14.5px] px-5 py-3 rounded-full shadow-[0_4px_14px_rgba(0,0,0,0.18)] hover:shadow-[0_6px_20px_rgba(0,0,0,0.25)] transition-all active:scale-[0.98]"
        >
          Claim your pop.site
        </button>
      </form>

      <!-- Trust Indicator -->
      <div class="mt-3.5 flex items-center gap-1.5 text-neutral-400 text-[12.5px] font-normal">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="14" x="2" y="5" rx="2"/>
          <line x1="2" x2="22" y1="10" y2="10"/>
          <line x1="1" x2="23" y1="1" y2="23" class="stroke-neutral-400"/>
        </svg>
        <span>No credit card required to start</span>
      </div>
    </div>

    <!-- ================= PHONE SHOWCASE CAROUSEL ================= -->
    <div class="w-full mt-14 pt-4 pb-12 phone-container relative">
      <div class="flex items-center justify-center gap-6 sm:gap-8 px-6 overflow-x-auto hide-scrollbar">
        
        <!-- Phone 1 (Sofia Delgado / Green-Cream Theme) -->
        <div class="phone-mockup">
          <img 
            src="https://framerusercontent.com/images/B5hQQjZTaCqWNhCywO7Tsyfslc.jpg?width=804&height=1748" 
            alt="Sofia Delgado Profile" 
            class="phone-screen"
            loading="lazy"
          />
          <div class="phone-bezel" style="background-image: url('https://framerusercontent.com/images/a9gc2DlbpkkZlsKZRlBfRklZyY.png');"></div>
        </div>

        <!-- Phone 2 (Oliur / Dark Creative Portfolio) -->
        <div class="phone-mockup">
          <img 
            src="https://framerusercontent.com/images/mTeoTkqiaI38uPj8b3LOrVSElQE.png?width=804&height=1792" 
            alt="Creator Profile" 
            class="phone-screen"
            loading="lazy"
          />
          <div class="phone-bezel" style="background-image: url('https://framerusercontent.com/images/a9gc2DlbpkkZlsKZRlBfRklZyY.png');"></div>
        </div>

        <!-- Phone 3 (Django Degree / Editorial Blue) -->
        <div class="phone-mockup">
          <img 
            src="https://framerusercontent.com/images/IcNMJpgyMGgRY6j3wmwEwZKn3dg.png?width=1206&height=2688" 
            alt="Django Degree Profile" 
            class="phone-screen"
            loading="lazy"
          />
          <div class="phone-bezel" style="background-image: url('https://framerusercontent.com/images/a9gc2DlbpkkZlsKZRlBfRklZyY.png');"></div>
        </div>

        <!-- Phone 4 (Modern Minimalist / Purple Accent) -->
        <div class="phone-mockup">
          <img 
            src="https://framerusercontent.com/images/6YWK2DSlMSB5fdhj26NEv60Te1s.png?width=1206&height=2688" 
            alt="Minimalist Portfolio" 
            class="phone-screen"
            loading="lazy"
          />
          <div class="phone-bezel" style="background-image: url('https://framerusercontent.com/images/a9gc2DlbpkkZlsKZRlBfRklZyY.png');"></div>
        </div>

      </div>
    </div>

  </main>

  <!-- Floating Chat Badge Icon (Bottom Right) -->
  <button 
    aria-label="Support Chat" 
    class="fixed bottom-6 right-6 w-12 h-12 rounded-full bg-neutral-950 text-white flex items-center justify-center shadow-2xl hover:scale-105 transition-transform active:scale-95 z-50"
    onclick="window.open('https://pop.site', '_blank')"
  >
    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
      <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
    </svg>
  </button>
